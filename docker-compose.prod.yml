services:
  app:
    image: 3aly2meen/myapp:codescope2
    container_name: codescope-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET}
      # OTP email delivery — REQUIRED in production (lib/email.ts throws if the
      # key is missing, so sign-in codes can't be sent). Define both on the prod
      # host (its .env next to this compose file).
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM}
      # Cloudflare Turnstile on the two public forms (/contact, /get-started).
      # Optional: unset, the widget does not render and the routes verify
      # nothing — exactly the behaviour before Turnstile existed.
      #
      # ⚠️ Only the SECRET belongs here. The matching site key is a BUILD-time
      # value baked into the browser bundle (see the ARG in the Dockerfile) and
      # setting it here as well is the one combination that can break the forms:
      # the server would read a site key from this file, conclude Turnstile is
      # configured, and start demanding a token from a page whose bundle was
      # built without one — every submission rejected, with no way for a visitor
      # to clear it. Leaving it out means the server and the browser can only
      # ever see the same value, the one the image was built with.
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

volumes:
  postgres_data:
    driver: local

networks:
  app-network:
    driver: bridge
